name: habla
description: "Habla — Plataforma CAA con IA para tabletas Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navegación
  go_router: ^14.6.2

  # Persistencia
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.28

  # Voz TTS
  flutter_tts: ^4.2.0

  # Red
  dio: ^5.8.0+1
  http: ^1.2.2

  # UI / Componentes
  fl_chart: ^0.69.0
  reorderable_grid_view: ^2.2.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.0.2
  url_launcher: ^6.3.1

  # Utilidades
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  archive: ^4.0.4

  # Actualizaciones in-app
  in_app_update: ^4.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/vocabulary.json
    - assets/data/phrases.json
    - assets/data/scenarios.json
    - assets/data/activities.json
    - assets/data/profiles_default.json
    - assets/symbols/placeholder.png

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
